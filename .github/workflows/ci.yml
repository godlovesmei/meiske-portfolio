name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'  # Tambahkan cache untuk mempercepat
    
    # DEBUG: Cek apakah package.json dan pnpm-workspace.yaml ada
    - name: Verify project files
      run: |
        echo "=== Root files ==="
        ls -la
        echo "=== package.json ==="
        cat package.json || echo "❌ package.json missing"
        echo "=== pnpm-workspace.yaml ==="
        cat pnpm-workspace.yaml || echo "⚠️ pnpm-workspace.yaml missing (bukan workspace?)"

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run Linters
      run: pnpm lint

    - name: Run Unit Tests
      run: pnpm test run

    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps

    - name: Run E2E Tests
      run: pnpm exec playwright test

    - name: Build Application
      run: pnpm build